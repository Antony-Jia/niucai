name: Desktop CI
on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'services/kernel/src/niucai/api/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/desktop/**', 'services/kernel/src/niucai/api/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  # Let an active native build finish so installers and compiler cache survive.
  cancel-in-progress: false
jobs:
  frontend:
    name: Desktop interface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-report
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 14
  windows:
    name: Windows x64 installers
    needs: frontend
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
      - run: npm run build
      - name: Native formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Native unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build NSIS and MSI installers
        run: npm run desktop:build -- --bundles nsis,msi -- --locked
      - name: Verify native application starts
        shell: pwsh
        run: |
          $client = Start-Process -FilePath ./src-tauri/target/release/niucai-desktop.exe -PassThru
          Start-Sleep -Seconds 8
          if ($client.HasExited) { throw "Desktop exited during startup: $($client.ExitCode)" }
          Stop-Process -Id $client.Id
      - uses: actions/upload-artifact@v4
        with:
          name: niucai-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

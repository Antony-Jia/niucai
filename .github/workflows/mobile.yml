name: Android PWA CI
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'apps/desktop/src/**', 'apps/desktop/package*.json', 'services/kernel/**', 'deploy/**', '.github/workflows/mobile.yml', '.dockerignore']
  pull_request:
    paths: ['apps/web/**', 'apps/desktop/src/**', 'apps/desktop/package*.json', 'services/kernel/**', 'deploy/**', '.github/workflows/mobile.yml', '.dockerignore']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: services/kernel/uv.lock
      - run: uv sync --frozen --project services/kernel
      - run: npm ci --prefix apps/desktop
      - run: npm ci --prefix apps/web
      - name: Format and type checks
        working-directory: apps/web
        run: npm run format:check && npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Android portrait, small screen and landscape flows
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload mobile screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pwa-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
  image:
    name: PWA container and proxy configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/web/Dockerfile -t niucai-web:ci .
      - name: Serve installable PWA assets
        run: |
          docker run -d --name niucai-web -p 127.0.0.1:8090:80 niucai-web:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/manifest.webmanifest > /tmp/manifest.json; then break; fi
            sleep 1
          done
          python -c 'import json; d=json.load(open("/tmp/manifest.json")); assert d["display"] == "standalone"'
          curl --fail http://127.0.0.1:8090/sw.js
          curl --fail http://127.0.0.1:8090/icons/icon-512.png -o /tmp/icon.png
      - name: Validate Caddy routes
        run: docker run --rm -e NIUCAI_DOMAIN=agent.example.com -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy adapt --config /etc/caddy/Caddyfile --validate
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-only-password
          NIUCAI_DOMAIN: agent.example.com
        run: |
          cp deploy/compose/.env.example deploy/compose/.env
          docker compose -f deploy/compose/docker-compose.yml --profile public config --quiet
      - if: always()
        run: docker rm -f niucai-web || true

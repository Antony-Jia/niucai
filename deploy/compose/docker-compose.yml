name: niucai
x-kernel: &kernel
  build:
    context: ../../services/kernel
  env_file: .env
  environment:
    NIUCAI_DATABASE_URL: postgresql+psycopg://niucai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/niucai
    NIUCAI_WORKSPACE: /workspace
    NIUCAI_MODEL_CONFIG_PATH: /app/models.yaml
  volumes:
    - workspace:/workspace
    - ../../services/kernel/models.yaml:/app/models.yaml:ro
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: niucai
      POSTGRES_USER: niucai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U niucai -d niucai"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: ../../services/kernel
    env_file: .env
    environment:
      NIUCAI_DATABASE_URL: postgresql+psycopg://niucai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/niucai
    command: [uv, run, --no-sync, alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    <<: *kernel
    command: [uv, run, --no-sync, uvicorn, niucai.api.app:app, --host, 0.0.0.0, --port, "8080"]
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    <<: *kernel
    command: [uv, run, --no-sync, python, -m, niucai.worker]
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
  caddy:
    image: caddy:2
    profiles: [public]
    environment:
      NIUCAI_DOMAIN: ${NIUCAI_DOMAIN:?set NIUCAI_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  workspace:
  caddy_data:
  caddy_config:

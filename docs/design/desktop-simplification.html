<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>niucai · 桌面简化设计稿</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#223046;background:#f5f7fb;font-size:14px;--blue:#395dcc;--muted:#768397;--line:#e5eaf2}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:inherit;border-radius:8px;padding:10px 16px;min-height:40px}button:hover{background:#f0f4ff}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #91adff;outline-offset:3px}button:disabled{cursor:default;opacity:.5}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#294bb6}.shell{display:flex;min-height:100vh}.sidebar{width:208px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:35px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;margin:0 10px 46px;font-size:25px;letter-spacing:-1px;font-weight:750}.mark{background:var(--blue);color:white;border-radius:10px;padding:2px 10px;font-size:26px}.nav{display:grid;gap:8px}.nav button,.bottom button{text-align:left;border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px 14px}.nav button.active{background:#edf2ff;color:var(--blue);font-weight:650}.nav svg,.bottom svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6}.bottom{margin-top:auto}.workspace{border-top:1px solid var(--line);margin-top:18px;padding:20px 10px 0;font-size:12px;color:var(--muted)}.workspace strong{color:#34445c;display:block;margin-bottom:6px}.main{flex:1;min-width:0}.top{height:72px;display:flex;justify-content:space-between;align-items:center;padding:0 46px;border-bottom:1px solid var(--line);background:#ffffffa8;color:#64728a}.top b{color:#26354a;font-weight:500}.prototype{font-size:11px;letter-spacing:.3px;color:#7c6b40;background:#fbf4df;padding:6px 10px;border-radius:6px}.content{max-width:1120px;margin:auto;padding:40px 46px 60px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 10px}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0 0 10px}p{line-height:1.8}.muted{color:var(--muted)}.lead{margin:0 0 25px;color:var(--muted)}.composer{border:1px solid #d7e0f1;border-radius:14px;background:white;box-shadow:0 6px 20px #23395d06;padding:18px 20px}.composer textarea{resize:vertical;min-height:66px;width:100%;border:0;background:none;outline:none;line-height:1.8}.composer textarea::placeholder{color:#929daf}.composer-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.hint{font-size:12px;color:var(--muted)}.examples{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 30px}.examples button{border:0;background:transparent;color:#6b7890;font-size:12px;padding:5px 10px;min-height:30px}.examples button:hover{background:#e9eef9}.attention{background:#fffaf0;border:1px solid #efdfb9;border-radius:12px;padding:19px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:34px}.attention h3{color:#8b641c;margin-bottom:6px}.attention p{margin:0;color:#8b7851;font-size:13px}.attention button{background:transparent;border-color:#dfc993;color:#806020;white-space:nowrap}.section-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px}.search{background:white;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:210px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:8px}.tabs button{border:0;background:none;color:#758096;padding:7px 14px;min-height:34px}.tabs button.active{color:var(--blue);background:#e9effd;font-weight:600}.tabs span{font-size:11px;margin-left:6px}.task{display:flex;width:100%;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:22px 4px;gap:16px}.task:hover{background:#eef2f9}.task-icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid #dce4f4;background:white;border-radius:11px;color:#6480b9;font-size:18px;flex-shrink:0}.task-copy{flex:1;min-width:0}.task-title{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}.task-summary{display:block;color:var(--muted);font-size:12px;margin-top:7px}.pill{font-size:12px;border-radius:5px;padding:5px 9px;white-space:nowrap;background:#eaf0fd;color:#4e6da8}.pill.wait{background:#fff0cf;color:#93671a}.pill.done{background:#e6f4ee;color:#397960}.when{font-size:12px;color:#8e98aa;min-width:50px;text-align:right}.note{font-size:12px;color:#8c97a8;margin-top:22px}.back{border:0;background:transparent;padding-left:0;color:#687891;margin-bottom:18px}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.detail-head h1{font-size:24px;letter-spacing:0;margin:0 0 10px}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px}.message{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}.message p{margin:10px 0 0}.speaker{font-size:12px;color:#7b899e}.user-message{background:#f4f6fb;border:0;border-radius:9px;padding:16px}.approval{border:1px solid #e8d3a7;background:#fffbf1;padding:20px;border-radius:10px}.approval p{font-size:13px;color:#786949}.actions{display:flex;gap:9px;flex-wrap:wrap}.steps{list-style:none;padding:0;margin:24px 0}.steps li{position:relative;padding:0 0 25px 26px;color:#7b8799;font-size:13px}.steps li:before{content:'○';position:absolute;left:0;color:#a4afc0}.steps li.complete:before{content:'✓';color:#4b9275}.steps li.current{color:#ad7b26}.steps li.current:before{content:'●';color:#cca24f}.steps small{display:block;margin-top:5px;color:#94a0b2}.reply{display:flex;gap:10px;margin-top:24px}.reply input{width:100%;min-width:0;border:1px solid var(--line);padding:12px;border-radius:8px}.reply button{white-space:nowrap}.file-row{display:flex;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}.file-row .grow{flex:1}.file-row small{display:block;color:var(--muted);margin-top:6px}.device-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.device{padding:24px}.device .pill{display:inline-block;margin:8px 0}.device p{font-size:13px;color:var(--muted)}details{margin-top:20px;font-size:12px;color:#7b899d}summary{cursor:pointer;padding:8px 0}.empty{padding:45px;text-align:center;color:var(--muted)}#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);max-width:90vw;background:#26364d;color:white;padding:13px 22px;border-radius:9px;box-shadow:0 8px 30px #0002;z-index:5}#toast:empty{display:none}.setting{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line)}.setting p{font-size:12px;margin:6px 0 0;color:var(--muted)}@media(min-width:1500px){.content{padding-top:60px}}@media(max-width:1100px){.content{padding:30px}.top{padding:0 30px}.sidebar{width:180px}.detail-grid{grid-template-columns:minmax(0,1fr) 220px}}@media(max-width:900px){.detail-grid{grid-template-columns:1fr}.device-grid{grid-template-columns:1fr}.sidebar{width:150px;padding:25px 12px}.brand{font-size:21px}.when{display:none}.content{padding:25px}.top{padding:0 25px}}@media(max-width:650px){.shell{display:block}.sidebar{position:static;height:auto;width:100%;padding:15px;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:15px}.brand{margin:0;font-size:20px}.nav{display:flex;gap:2px}.nav button{padding:9px}.nav svg,.workspace,.bottom,.brand .mark{display:none}.top{height:54px;font-size:12px;padding:0 18px}.content{padding:28px 18px}h1{font-size:26px}.attention{align-items:flex-start;padding:16px}.attention button{padding:8px}.task{gap:10px}.task-icon{display:none}.task-title{font-size:14px}.section-top{align-items:flex-start}.search{width:145px}.detail-head{align-items:flex-start}.detail-head h1{font-size:21px}.panel{padding:18px}.prototype{font-size:10px}.tabs button{padding:6px 10px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><span class="mark">n</span>niucai</div><nav class="nav" aria-label="主导航">
<button data-page="tasks" class="active"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8 9 2 2 5-5M8 16h8"/></svg>任务</button>
<button data-page="files"><svg viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3Z"/></svg>文件</button>
<button data-page="devices"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>设备</button></nav>
<div class="bottom"><button data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>设置</button><div class="workspace"><strong>个人工作空间</strong>设计演示 · 未连接服务</div></div></aside>
<main class="main"><header class="top"><b id="crumb">个人工作空间 / 任务</b><span class="prototype">交互设计稿 · 全部为示例数据</span></header><div id="view" class="content"></div></main>
</div><div id="toast" role="status" aria-live="polite"></div>
<script>
const tasks=[{id:1,title:'整理本周 AI 行业动态',summary:'摘要已整理，发送邮件前需要你确认',status:'wait',time:'刚刚'},{id:2,title:'对比三款项目管理工具',summary:'正在整理功能、价格和适用场景',status:'running',time:'5 分钟前'},{id:3,title:'整理上周会议纪要',summary:'已生成会议摘要和 6 项待办',status:'done',time:'昨天'}];
let currentPage='tasks',filter='all',query='',selected=1;
const view=document.querySelector('#view');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=s=>({wait:'需要你处理',running:'进行中',done:'已完成',paused:'已暂停'})[s];
function toast(s){document.querySelector('#toast').textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4000)}
function navigate(p){currentPage=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelector('#crumb').textContent='个人工作空间 / '+({tasks:'任务',files:'文件',devices:'设备',settings:'设置'})[p];({tasks:home,files:files,devices:devices,settings:settings})[p]();window.scrollTo(0,0)}
function home(){const waiting=tasks.filter(t=>t.status==='wait');view.innerHTML=`<h1>今天想完成什么？</h1><p class="lead">交代给 niucai，在这里跟进每一件事。</p><form id="create" class="composer"><textarea id="prompt" aria-label="任务要求" placeholder="例如：整理本周 AI 行业新闻，给我一份带来源的摘要" required maxlength="1000"></textarea><div class="composer-foot"><span class="hint">用一句话开始，也可以写下具体要求</span><button class="primary" type="submit">开始任务 ↗</button></div></form><div class="examples"><button data-example="整理本周 AI 行业新闻，给我一份带来源的摘要">整理资料 ↗</button><button data-example="对比三款项目管理工具的功能与价格">帮我做个对比 ↗</button><button data-example="把以下会议记录整理成摘要和待办">整理会议记录 ↗</button></div>${waiting.length?`<section class="attention"><div><h3>${waiting.length} 个任务需要你处理</h3><p>${escapeHTML(waiting[0].title)} · 发送邮件前需要确认</p></div><button data-open="${waiting[0].id}">查看并处理 →</button></section>`:''}<div class="section-top"><h2>我的任务</h2><input class="search" id="search" aria-label="搜索任务" placeholder="搜索任务…" value="${escapeHTML(query)}"></div><div class="tabs" role="group" aria-label="任务筛选">${[['all','全部',tasks.length],['running','进行中',tasks.filter(t=>['running','paused'].includes(t.status)).length],['wait','待处理',waiting.length],['done','已完成',tasks.filter(t=>t.status==='done').length]].map(([v,n,c])=>`<button aria-pressed="${v===filter}" class="${v===filter?'active':''}" data-filter="${v}">${n}<span>${c}</span></button>`).join('')}</div><div id="rows"></div><p class="note">示例流程：查看待处理任务 → 检查动作 → 模拟批准或拒绝。不会发送邮件或启动执行。</p>`;rows();document.querySelector('#create').onsubmit=e=>{e.preventDefault();const p=document.querySelector('#prompt').value.trim();if(!p)return;const id=Date.now();tasks.unshift({id,title:p,summary:'演示任务已创建，尚未连接实际执行服务',status:'running',time:'刚刚'});selected=id;detail();toast('仅创建本地演示任务，刷新后重置')};document.querySelector('#search').oninput=e=>{query=e.target.value;rows()}}
function rows(){const list=tasks.filter(t=>(filter==='all'||(filter==='running'?['running','paused'].includes(t.status):t.status===filter))&&t.title.toLowerCase().includes(query.toLowerCase()));document.querySelector('#rows').innerHTML=list.length?list.map(t=>`<button class="task" data-open="${t.id}"><span class="task-icon">${t.status==='done'?'✓':'≡'}</span><span class="task-copy"><span class="task-title">${escapeHTML(t.title)}</span><span class="task-summary">${escapeHTML(t.summary)}</span></span><span class="pill ${t.status}">${label(t.status)}</span><span class="when">${t.time}</span><span class="muted">›</span></button>`).join(''):'<div class="empty">没有符合条件的任务</div>'}
function detail(){const t=tasks.find(t=>t.id===selected);const sample=t.id===1;view.innerHTML=`<button class="back" data-page="tasks">← 返回任务</button><div class="detail-head"><div><h1>${escapeHTML(t.title)}</h1><span class="pill ${t.status}">${label(t.status)}</span></div>${['running','paused'].includes(t.status)?`<button id="pause">${t.status==='paused'?'继续任务':'暂停任务'}</button>`:''}</div><div class="detail-grid"><section class="panel"><div class="message user-message"><span class="speaker">你 · 任务要求</span><p>${sample?'整理本周 AI 行业动态，附上来源，并将摘要发送给我。':escapeHTML(t.title)}</p></div><div class="message"><span class="speaker">niucai</span><p>${sample?'资料已整理成摘要。发送邮件前，请检查下方的收件人和内容范围。':t.status==='done'?'会议摘要和待办已整理完成，你可以查看结果。':escapeHTML(t.summary)}</p></div>${t.status==='wait'?`<div class="approval"><h3>允许发送这封邮件吗？</h3><p>收件人：me@example.com（示例）<br>主题：本周 AI 行业动态<br>内容：摘要正文与来源链接，无附件。<br>发送后对方会收到邮件，无法撤回。</p><details><summary>查看完整邮件内容（示例）</summary><p>本周动态摘要：这里是演示正文，正式界面应展示真实待发送内容与完整来源。</p></details><div class="actions"><button class="primary" id="approve">批准本次发送</button><button id="reject">不发送</button></div></div>`:t.status==='done'?`<h3>任务结果</h3><p>${sample?'摘要已保留。此处演示授权处理后的结果，不代表真实邮件已发送。':'本次会议确定了下一阶段的工作安排，整理了负责人、截止日期与 6 项待办。'}</p><button data-page="files">查看成果文件 →</button>`:`<p class="muted">${t.status==='paused'?'任务已在演示中暂停，可点击右上角继续。':'这里呈现最近一条有效进度，详细执行事件收起到日志中。'}</p>`}<form class="reply" id="reply"><input aria-label="补充要求" placeholder="补充要求或回答问题…" required><button type="submit">发送</button></form></section><aside><section class="panel"><h3>任务进度</h3><ul class="steps"><li class="complete">理解要求</li><li class="${sample||t.status==='done'?'complete':'current'}">整理资料${sample?'<small>摘要已生成</small>':''}</li><li class="${t.status==='wait'?'current':t.status==='done'?'complete':''}">${sample?'确认发送方式':'整理结果'}${t.status==='wait'?'<small>等待你的决定</small>':''}</li></ul><button style="width:100%" id="computer">查看执行设备</button><details><summary>参与助手与执行日志</summary><p>研究助手 · 示例角色<br>原始事件与工具调用在这里按需查看。</p></details></section><p class="note">步骤仅用于演示。真实界面应使用服务端进度，不推测完成比例。</p></aside></div>`;document.querySelector('#reply').onsubmit=e=>{e.preventDefault();toast('演示：补充要求已收到，不会提交至服务端');e.target.reset()};document.querySelector('#computer').onclick=()=>navigate('devices');if(document.querySelector('#pause'))document.querySelector('#pause').onclick=()=>{t.status=t.status==='paused'?'running':'paused';detail();toast('已更新本地演示状态')};for(const id of ['approve','reject'])if(document.querySelector('#'+id))document.querySelector('#'+id).onclick=()=>{t.status='done';t.summary=id==='approve'?'演示：已确认发送，摘要已保留':'演示：未发送邮件，摘要已保留';detail();toast(id==='approve'?'模拟确认完成；没有发送任何邮件':'模拟拒绝完成；没有发送任何邮件')}}
function files(){view.innerHTML='<h1>文件</h1><p class="lead">任务的成果，都能在这里找回。</p><section class="panel">'+[['本周 AI 行业动态.md','整理本周 AI 行业动态',1],['会议摘要与待办.md','整理上周会议纪要',3]].map(([name,title,id])=>`<div class="file-row"><span class="task-icon">▤</span><div class="grow"><strong>${name}</strong><small>来自：${title} · 示例文件</small></div><button data-open="${id}">查看来源任务</button></div>`).join('')+'<p class="note">本设计稿不包含实际成果文件。正式版仅对真实可用文件提供查看与下载。</p></section>'}
function devices(){view.innerHTML='<h1>设备</h1><p class="lead">查看执行工作的地方，需要时再打开电脑。</p><h2 style="margin:26px 0 16px">可操作电脑</h2><div class="device-grid"><section class="panel device"><h3>云端电脑</h3><span class="pill">状态未知 · 演示未连接</span><p>连接后显示真实可用性、控制状态和当前任务。<br>最近心跳：暂无</p><button disabled>查看电脑</button></section></div><h2 style="margin:28px 0 16px">执行环境</h2><div class="device-grid"><section class="panel device"><h3>Windows 本机节点</h3><span class="pill">未连接 · 示例配置</span><p>运行任务的环境，不代表有可操作的远程桌面。</p><button data-page="settings">检查连接设置 →</button></section></div>'}
function settings(){view.innerHTML='<h1>设置</h1><p class="lead">日常只需配置一次，复杂选项按需展开。</p><section class="panel">'+[['连接','工作空间、服务地址与连接诊断'],['助手','设置执行任务的角色与可用能力'],['技能与工具','管理技能和 MCP 工具的使用范围'],['偏好与记忆','查看、纠正或删除保存的偏好']].map(([a,b])=>`<div class="setting"><div><h3>${a}</h3><p>${b}</p></div><button data-explain="${a}">管理 →</button></div>`).join('')+'<details><summary>高级：白板、看板、旧版协作与技术日志</summary><p>迁移期间保留原能力入口。此处展示信息架构，不连接旧页面或更改配置。</p></details></section>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);if(b.dataset.open){selected=Number(b.dataset.open);currentPage='tasks';document.querySelector('#crumb').textContent='个人工作空间 / 任务 / 详情';document.querySelectorAll('[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page==='tasks'));detail();window.scrollTo(0,0)}if(b.dataset.filter){filter=b.dataset.filter;home()}if(b.dataset.example){document.querySelector('#prompt').value=b.dataset.example;document.querySelector('#prompt').focus()}if(b.dataset.explain)toast('设计占位：'+b.dataset.explain+'将在现有配置能力上整合')});navigate('tasks');
</script>
</body>
</html>

# Private KasmVNC relay; bound to host loopback by Compose.
# Preserve HTTP Basic authentication and WebSocket upgrade headers.
# TLS verification is relaxed only for this self-signed private upstream.

upstream kasmvnc_upstream {
    server computer:6901;
}

server {
    listen 6901;
    server_name _;

    # Streams (vnc.html assets, websockify) can be large; do not buffer.
    proxy_buffering off;
    proxy_request_buffering off;

    # KasmVNC uses a self-signed cert. Trust only this upstream, do NOT
    # disable TLS verification globally.
    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;

    location / {
        proxy_pass https://kasmvnc_upstream;

        # WebSocket / KasmVNC binary websocket upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the client's credentials through; never hardcode secrets here.
        proxy_pass_request_headers on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

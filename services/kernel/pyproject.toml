[project]
name = "niucai-kernel"
version = "0.1.0"
description = "Personal Agent Computer control kernel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pgvector>=0.3,<1",
    "websockets>=15,<17",
]
[project.optional-dependencies]
harness = ["deepagents>=0.7.20,<1", "langgraph>=1.2,<2", "langchain>=1.4,<2", "langchain-core>=1,<2", "langgraph-checkpoint>=4,<5"]
browser = ["playwright>=1.50,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/niucai"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I"]
